<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title|default("כלי PDF ללוקיישנים") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img src="{{ url_for('static', filename='logo.png') }}" alt="" class="brand-logo"><span>כלי PDF ללוקיישנים</span></a>
    {% if show_nav is not defined or show_nav %}
    <nav class="nav">
      <a href="/">בית</a>
      <a href="/dev/checks">בדיקות</a>
      <a href="/dev/sample-pdf">PDF לדוגמה</a>
      <form method="post" action="/logout" class="inline-form"><button type="submit" class="link-button">יציאה</button></form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
